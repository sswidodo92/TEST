<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pemetaan Siswa · CLASH OF BOTS (Guru)</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#14213d;--mut:#55617d;--line:#d3dbe7;--acc:#f0a30a;--accink:#14213d;--bar:#e3e9f2;--warn:#b45309;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1325;--card:#162039;--ink:#e8eefb;--mut:#9fadc9;--line:#2a3858;--bar:#223052;--warn:#fbbf24}}
:root[data-theme="dark"]{--bg:#0c1325;--card:#162039;--ink:#e8eefb;--mut:#9fadc9;--line:#2a3858;--bar:#223052;--warn:#fbbf24}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1000px;margin:0 auto;padding:20px 16px 48px}
h1,h2,h3{font-family:"Chakra Petch",system-ui,sans-serif;line-height:1.2;margin:0 0 10px}
h1{font-size:1.8rem}h2{font-size:1.3rem;margin-top:26px}h3{font-size:1.05rem}
p{margin:0 0 12px}.mut{color:var(--mut);font-size:.92rem}.warn{color:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:600;margin:12px 0 6px}
textarea,select,input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:160px;font-family:ui-monospace,Menlo,monospace;font-size:.85rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.two{grid-template-columns:1fr}}
:is(textarea,select,input,button):focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn{display:block;width:100%;font:inherit;font-weight:700;color:var(--accink);background:var(--acc);border:0;border-radius:10px;padding:12px;margin-top:12px;cursor:pointer}
.btn.sec{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.84rem;background:var(--card)}
th,td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{background:var(--bar);position:sticky;top:0}
td.n{text-align:center}.nw{white-space:nowrap}
.tag{display:inline-block;font-weight:700;font-size:.78rem;border-radius:99px;padding:1px 10px;border:1.5px solid var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.grid .card{margin:0}
.k{color:var(--mut)}
.bar{display:flex;gap:2px;height:10px;margin:4px 0 2px}.bar i{background:var(--acc);border-radius:2px}
.cb{display:grid;grid-template-columns:90px 1fr 40px;align-items:center;gap:8px;font-size:.82rem;margin-top:4px}.cb .tr{display:block;background:var(--bar);border-radius:5px;height:10px;overflow:hidden}.cb i{display:block;height:10px;background:var(--acc)}.cb em{font-style:normal;text-align:right}
</style>
</head>
<body>
<main>
<h1>Pemetaan Siswa</h1>
<p class="mut">CLASH OF BOTS · alat bantu guru. Tempel kode hasil murid (satu baris satu murid; kode posttest berakhiran |B dan tes lanjutan |C) lalu tekan Petakan. Boleh ditempel langsung dari WhatsApp, awalan tanggal dan pengirim dibuang otomatis.</p>
<div class="card">
 <label for="data">Kode hasil murid</label>
 <textarea id="data" spellcheck="false" placeholder="Budi|XI TEI 2|3|2|4|1&#10;Sari|XI TEI 4|1|4|2|2"></textarea>
 <div class="two">
  <div><label for="mode">Batas kategori</label><select id="mode"><option value="rel">Relatif (sepertiga kelas)</option><option value="fix">Tetap (0–5, 6–10, 11–16)</option></select></div>
  <div><label for="size">Anggota per tim</label><input id="size" type="number" min="3" max="8" value="4"></div>
 </div>
 <button class="btn" id="go">Petakan</button>
 <button class="btn sec" id="demo">Isi contoh data (untuk uji coba)</button>
 <p id="msg" class="mut" role="status" style="margin-top:10px"></p>
</div>
<div id="out"></div>
</main>
<script>
var D=[{k:'M',n:'Mekanik',s:'Mek',r:'Perakit'},{k:'P',n:'Pemrograman',s:'Prog',r:'Programmer'},{k:'E',n:'Elektronika',s:'Elek',r:'Perangkai rangkaian'},{k:'T',n:'Troubleshooting',s:'Trbl',r:'Penguji'}];
function lvl(v){return v>=3?'Tantangan':v===2?'Lanjutan':'Dasar + petunjuk bertingkat'}
function parse(text){var rows=[],bad=[],warn=[],seen={};
 text.split(/\r?\n/).forEach(function(l){l=l.trim();if(!l)return;
  var c=l.replace(/^\[[^\]]*\]\s*[^:|]*:\s*/,'').replace(/^\d{1,2}\/\d{1,2}\/\d{2,4},?\s*\d{1,2}[.:]\d{2}(?:\s?[APap][Mm])?\s*-\s*[^:|]*:\s*/,'');
  var m=c.match(/^\s*([^|]+?)\s*\|\s*([^|]+?)\s*\|\s*([0-4])\s*\|\s*([0-4])\s*\|\s*([0-4])\s*\|\s*([0-4])\s*(?:\|\s*([ABC]))?\s*$/);
  if(!m){bad.push(l);return}
  var r={n:m[1],k:m[2],M:+m[3],P:+m[4],E:+m[5],T:+m[6],s:m[7]||'A',notes:[]};r.t=r.M+r.P+r.E+r.T;
  var key=(r.n+'|'+r.k+'|'+r.s).toLowerCase();
  if(seen[key]!==undefined){var o=rows[seen[key]],same=o.M===r.M&&o.P===r.P&&o.E===r.E&&o.T===r.T;
   warn.push(r.n+' ('+r.k+') terkirim ganda'+(same?' dengan skor sama, dipakai satu.':' dengan skor BERBEDA, dipakai kiriman terakhir. Mohon konfirmasi ke murid.'));rows[seen[key]]=r}
  else{seen[key]=rows.length;rows.push(r)}});
 return{rows:rows,bad:bad,warn:warn}}
function perms(a){if(a.length<2)return[a];var r=[];a.forEach(function(x,i){perms(a.slice(0,i).concat(a.slice(i+1))).forEach(function(p){r.push([x].concat(p))})});return r}
function assign(team){var best=null;perms([0,1,2,3]).forEach(function(order){var used={},m={},sum=0;
 order.forEach(function(di){var k=D[di].k,bi=-1;team.forEach(function(r,i){if(!used[i]&&(bi<0||r[k]>team[bi][k]||(r[k]===team[bi][k]&&r.t<team[bi].t)))bi=i});
  if(bi>=0){used[bi]=1;m[bi]=D[di].r;sum+=team[bi][k]}});
 if(!best||sum>best.sum)best={sum:sum,m:m}});return best.m}
function deficits(ts){var c=0;ts.forEach(function(t){['M','P','E'].forEach(function(d){if(!t.some(function(r){return r[d]>=3}))c++})});return c}
function analyze(rows,mode,size){
 var n=rows.length,tots=rows.map(function(r){return r.t}).sort(function(a,b){return a-b}),c1,c2;
 if(mode==='fix'){c1=5;c2=10}else{c1=tots[Math.ceil(n/3)-1];c2=tots[Math.ceil(2*n/3)-1]}
 var dist={},mean={};D.forEach(function(d){dist[d.k]=[0,0,0,0,0];mean[d.k]=0});
 rows.forEach(function(r){
  r.cat=r.t<=c1?'Pemula':r.t<=c2?'Menengah':'Mahir';
  var o=D.map(function(d,i){return{i:i,v:r[d.k]}}).sort(function(a,b){return b.v-a.v||a.i-b.i});
  r.utama=o[0].v<=1?'Belum menonjol':D[o[0].i].r+' ('+o[0].v+')';
  r.cad=o[0].v<=1||o[1].v<2?'-':D[o[1].i].r+' ('+o[1].v+')';
  r.rencana=D.map(function(d){return d.s+': '+lvl(r[d.k])}).join(' · ');
  if([c1,c1+1,c2,c2+1].indexOf(r.t)>=0)r.notes.push('Dekat batas kategori, cek lewat pengamatan praktik.');
  D.forEach(function(d){dist[d.k][r[d.k]]++;mean[d.k]+=r[d.k]/n})});
 rows.sort(function(a,b){return b.t-a.t||a.n.localeCompare(b.n)});
 var T=Math.max(1,Math.round(n/size)),teams=[],i;for(i=0;i<T;i++)teams.push([]);
 rows.forEach(function(r,i){var rd=Math.floor(i/T),p=i%T;teams[rd%2?T-1-p:p].push(r)});
 for(var pass=0;pass<6;pass++){var imp=false;
  for(var a=0;a<T;a++)for(var b=a+1;b<T;b++)for(var x=0;x<teams[a].length;x++)for(var y=0;y<teams[b].length;y++){
   var px=teams[a][x],py=teams[b][y];if(Math.abs(px.t-py.t)>1)continue;
   var before=deficits(teams);teams[a][x]=py;teams[b][y]=px;
   if(deficits(teams)<before)imp=true;else{teams[a][x]=px;teams[b][y]=py}}
  if(!imp)break}
 return{rows:rows,c1:c1,c2:c2,dist:dist,mean:mean,teams:teams.map(function(t){return{m:t,roles:assign(t)}})}}
//DOM
function h(t,a){var e=document.createElement(t);a=a||{};for(var k in a){if(k==='class')e.className=a[k];else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),a[k]);else e.setAttribute(k,a[k])}
 for(var i=2;i<arguments.length;i++)[].concat(arguments[i]).forEach(function(x){if(x!=null)e.append(x)});return e}
var $=function(s){return document.getElementById(s)};
var SAMPLE='Andi|XI TEI 1|4|2|1|3\nBima|XI TEI 2|1|4|3|2\nCitra|XI TEI 3|2|1|4|1\nDewi|XI TEI 4|3|3|2|4\nEko|XI TEI 5|0|1|1|0\nFajar|XI TEI 1|2|2|2|2\nGita|XI TEI 2|4|4|3|3\nHadi|XI TEI 3|1|0|2|1\nIndra|XI TEI 4|3|1|4|2\nJoko|XI TEI 5|2|3|1|1\nKiki|XI TEI 1|1|2|0|3\nLina|XI TEI 2|3|2|3|4';
try{var sv=localStorage.getItem('pemetaan-data');if(sv)$('data').value=sv}catch(e){}
function copy(str,btn){var done=function(m){btn.textContent=m;setTimeout(function(){btn.textContent=btn.dataset.l},1800)};
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(str).then(function(){done('Tersalin')},function(){done('Gagal menyalin')});else done('Gagal menyalin')}
function cbtn(label,fn){var b=h('button',{class:'btn sec','data-l':label},label);b.addEventListener('click',function(){copy(fn(),b)});return b}
function tbl(head,body){return h('div',{class:'tw'},h('table',{},h('tr',{},head.map(function(x){return h('th',{},x)})),body.map(function(r){return h('tr',{},r.map(function(c){return h('td',{class:typeof c==='number'?'n':''},String(c))}))})))}
function cmpEl(pre,oth){
 var key=function(r){return(r.n+'|'+r.k).toLowerCase()},I={},by={B:{},C:{}};pre.forEach(function(r){I[key(r)]=r});oth.forEach(function(r){by[r.s][key(r)]=r});
 var ks=Object.keys(I).filter(function(k){return by.B[k]||by.C[k]}),mean=function(a,f){return a.length?a.reduce(function(x,y){return x+f(y)},0)/a.length:null},f2=function(v){return v==null?'-':v.toFixed(2)};
 if(!ks.length)return h('div',{class:'card'},h('p',{class:'warn'},'Kode posttest/tes lanjutan tidak cocok dengan nama dan kelas pada data pretest. Periksa ejaan nama dan kelas.'));
 var kb=ks.filter(function(k){return by.B[k]}),kc=ks.filter(function(k){return by.C[k]}),P=kb.map(function(k){return I[k]}),Q2=kb.map(function(k){return by.B[k]}),L=kc.map(function(k){return by.C[k]});
 var dims=[['M','Mekanik'],['P','Pemrograman'],['E','Elektronika'],['T','Troubleshooting'],['t','Total (0–16)']];
 var sum=dims.map(function(d){var a=mean(P,function(r){return r[d[0]]}),b=mean(Q2,function(r){return r[d[0]]}),c=mean(L,function(r){return r[d[0]]}),mx=d[0]==='t'?16:4,g=(b!=null&&a<mx)?(b-a)/(mx-a):null;return{n:d[1],a:a,b:b,c:c,g:g,mx:mx}});
 var tg=sum[4].g;
 var rows=ks.map(function(k){var a=I[k],b=by.B[k],c=by.C[k],g=(b&&a.t<16)?((b.t-a.t)/(16-a.t)).toFixed(2):'-',dm=function(d){return a[d]+(b?'→'+b[d]:'')+(c?'→'+c[d]:'')};return[a.n,a.k,a.t,b?b.t:'-',g,c?c.t:'-',dm('M'),dm('P'),dm('E'),dm('T')]});
 var lab=function(g){return g==null?'-':g>=0.7?'tinggi':g>=0.3?'sedang':'rendah'};
 return h('div',{},h('h2',{},'4. Perbandingan pretest–posttest–tes lanjutan'),
  h('div',{class:'card'},h('p',{},h('b',{},kb.length+' murid'),' punya pretest dan posttest'+(kc.length?', '+kc.length+' murid punya tes lanjutan.':'.')),
   h('p',{},'Rata-rata total: pretest ',h('b',{},f2(sum[4].a)),' → posttest ',h('b',{},f2(sum[4].b)),kc.length?' → tes lanjutan '+f2(sum[4].c):'','.'),
   h('p',{},'Gain ternormalisasi kelas (Hake): ',h('b',{},f2(tg)),' ('+lab(tg)+'). Kategori lazim: < 0,3 rendah, 0,3–0,7 sedang, > 0,7 tinggi.'),
   h('p',{class:'mut'},'Rata-rata tes lanjutan dihitung hanya dari murid yang mengikuti tes lanjutan, jadi jumlahnya bisa berbeda dari pretest dan posttest.'),
   h('p',{class:'mut'},'Gain dihitung dari murid yang punya kedua tes. Ini bukan bukti sebab-akibat: tidak ada kelas pembanding. Tulis keterbatasan ini di naskah.')),
  h('div',{class:'tw'},h('table',{},h('tr',{},['Bidang','Pretest','Posttest','Tes lanjutan','Gain'].map(function(x){return h('th',{},x)})),sum.map(function(d){return h('tr',{},[d.n,f2(d.a),f2(d.b),f2(d.c),f2(d.g)].map(function(x){return h('td',{},x)}))}))),
  h('div',{class:'card',style:'margin-top:12px'},h('h3',{},'Rata-rata per bidang'),sum.slice(0,4).map(function(d){return h('div',{style:'margin-bottom:10px'},h('b',{},d.n),[['Pretest',d.a],['Posttest',d.b],['Tes lanjutan',d.c]].filter(function(x){return x[1]!=null}).map(function(x){return h('div',{class:'cb'},h('span',{},x[0]),h('span',{class:'tr'},h('i',{style:'width:'+(x[1]/d.mx*100)+'%'})),h('em',{},x[1].toFixed(2)))}))})),
  h('h3',{},'Per murid (bidang: pretest→posttest→lanjutan)'),tbl(['Nama','Kelas','Pre','Post','Gain','Lanj','M','P','E','T'],rows),
  cbtn('Salin tabel perbandingan',function(){return['Nama','Kelas','Pretest','Posttest','Gain','Tes lanjutan','Mekanik','Pemrograman','Elektronika','Troubleshooting'].join('\t')+'\n'+rows.map(function(r){return r.join('\t')}).join('\n')}))}
function run(){
 var txt=$('data').value;try{localStorage.setItem('pemetaan-data',txt)}catch(e){}
 var p=parse(txt),msg=$('msg'),out=$('out'),oth=p.rows.filter(function(r){return r.s!=='A'});p.rows=p.rows.filter(function(r){return r.s==='A'});
 if(!p.rows.length){msg.textContent='Belum ada kode pretest yang valid. Format: Nama|Kelas|M|P|E|T (skor 0–4). Kode posttest berakhiran |B dan tes lanjutan |C.';out.replaceChildren();return}
 msg.textContent=p.rows.length+' murid pretest terbaca'+(oth.length?', '+oth.length+' kode posttest/tes lanjutan.':'.');
 var A=analyze(p.rows,$('mode').value,Math.max(3,parseInt($('size').value)||4)),n=A.rows.length,k;
 var parts=[];
 if(p.bad.length||p.warn.length)parts.push(h('div',{class:'card'},h('h3',{},'Perlu dicek'),
  p.bad.length?h('p',{class:'warn'},p.bad.length+' baris tidak terbaca: '+p.bad.slice(0,5).join(' / ')+(p.bad.length>5?' …':'')):null,
  p.warn.map(function(w){return h('p',{class:'warn'},w)})));
 var cnt={Pemula:0,Menengah:0,Mahir:0};A.rows.forEach(function(r){cnt[r.cat]++});
 parts.push(h('h2',{},'1. Ringkasan kelas'),h('div',{class:'card'},
  h('p',{},h('b',{},n+' murid'),' · Pemula '+cnt.Pemula+' · Menengah '+cnt.Menengah+' · Mahir '+cnt.Mahir),
  h('p',{class:'mut'},'Batas kategori yang dipakai (total skor 0–16): Pemula ≤ '+A.c1+', Menengah '+(A.c1+1)+'–'+A.c2+', Mahir ≥ '+(A.c2+1)+'. Tulis batas ini dan alasannya di naskah.')),
  tbl(['Bidang','Skor 0','Skor 1','Skor 2','Skor 3','Skor 4','Rata-rata'],D.map(function(d){return[d.n].concat(A.dist[d.k],[A.mean[d.k].toFixed(2)])})));
 parts.push(h('h2',{},'2. Profil tiap murid'),
  tbl(['No','Nama','Kelas','M','P','E','T','Total','Kategori','Peran utama','Peran cadangan','Rencana diferensiasi','Catatan'],
   A.rows.map(function(r,i){return[i+1,r.n,r.k,r.M,r.P,r.E,r.T,r.t,r.cat,r.utama,r.cad,r.rencana,r.notes.join(' ')]})),
  h('p',{class:'mut',style:'margin-top:8px'},'M Mekanik, P Pemrograman, E Elektronika, T Troubleshooting. Skor 3–4 = Kuat, 2 = Cukup, 0–1 = perlu penguatan.'),
  cbtn('Salin tabel profil (tempel ke Google Sheets/Excel)',function(){return['No','Nama','Kelas','Mekanik','Pemrograman','Elektronika','Troubleshooting','Total','Kategori','Peran utama','Peran cadangan','Rencana diferensiasi','Catatan'].join('\t')+'\n'+A.rows.map(function(r,i){return[i+1,r.n,r.k,r.M,r.P,r.E,r.T,r.t,r.cat,r.utama,r.cad,r.rencana,r.notes.join(' ')].join('\t')}).join('\n')}));
 var tx=[];
 parts.push(h('h2',{},'3. Usulan tim seimbang ('+A.teams.length+' tim)'),
  h('p',{class:'mut'},'Dibagi dengan pola ular lalu ditukar seperlunya agar tiap tim punya murid kuat (skor 3 ke atas) di mekanik, pemrograman, dan elektronika. Periksa dan sesuaikan manual bila perlu (misalnya murid yang sering berkonflik).'),
  h('div',{class:'grid'},A.teams.map(function(t,i){
   var nm='Tim '+String.fromCharCode(65+i),tot=t.m.reduce(function(s,r){return s+r.t},0),
   miss=['M','P','E'].filter(function(d){return!t.m.some(function(r){return r[d]>=3})}).map(function(d){return D.filter(function(x){return x.k===d})[0].n});
   tx.push(nm+' (total '+tot+')');
   return h('div',{class:'card'},h('h3',{},nm+' · total '+tot),
    t.m.map(function(r,j){var role=t.roles[j]||'Pendukung / tutor sebaya';tx.push('- '+r.n+' ('+r.k+'): '+role);
     return h('div',{style:'margin-bottom:6px'},h('b',{},r.n),' ',h('span',{class:'k'},r.k+' · '+r.cat),h('br'),h('span',{class:'tag'},role),' ',h('span',{class:'k'},'M'+r.M+' P'+r.P+' E'+r.E+' T'+r.T))}),
    miss.length?h('p',{class:'warn'},'Belum ada murid kuat di: '+miss.join(', ')+'.'):h('p',{class:'mut'},'Mekanik, pemrograman, elektronika terwakili.'))})),
  cbtn('Salin susunan tim',function(){return tx.join('\n')}));
 if(oth.length)parts.push(cmpEl(A.rows,oth));out.replaceChildren.apply(out,parts)}
$('go').addEventListener('click',run);
$('demo').addEventListener('click',function(){$('data').value=SAMPLE;run()});
</script>
</body>
</html>
