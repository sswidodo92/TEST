*,*:before,*:after{box-sizing:inherit}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}

.chip{display:inline-block;font-weight:700;font-size:.85rem;border:1.5px solid var(--acc);border-radius:99px;padding:2px 12px;margin-bottom:10px}

footer{text-align:center;margin-top:18px}footer button{background:none;border:0;color:var(--mut);text-decoration:underline;font:inherit;cursor:pointer}
</style>

function guru(){
 var ta=h('textarea',{'aria-label':'Kode hasil murid',placeholder:'Tempel kode murid, satu baris satu murid.\nContoh: Budi|XI TEI 2|3|2|4|1'}),
 nt=h('input',{type:'number',min:'2',max:'20',value:'6','aria-label':'Jumlah tim'}),out=h('div',{});
 function go(){
  var rows=[],bad=0;ta.value.split('\n').forEach(function(l){l=l.trim();if(!l)return;var p=l.split('|');
   var v=p.slice(2,6).map(Number);
   if(p.length<6||v.some(function(x){return !(x>=0&&x<=4)||isNaN(x)})){bad++;return}
   rows.push({n:p[0],k:p[1],M:v[0],P:v[1],E:v[2],T:v[3],t:v[0]+v[1]+v[2]+v[3]})});
  if(!rows.length){out.replaceChildren(h('p',{class:'warn'},'Belum ada kode yang valid.'));return}
  rows.sort(function(a,b){return b.t-a.t});
  var T=Math.max(2,Math.min(20,parseInt(nt.value)||6)),teams=[];for(var i=0;i<T;i++)teams.push([]);
  rows.forEach(function(r,i){var rd=Math.floor(i/T),p=i%T;teams[rd%2?T-1-p:p].push(r)});
  var tb=h('table',{},h('tr',{},['No','Nama','Kelas','M','P','E','T','Total','Profil'].map(function(x){return h('th',{},x)})),
   rows.map(function(r,i){return h('tr',{},[i+1,r.n,r.k,r.M,r.P,r.E,r.T,r.t,prof(r.t)].map(function(x){return h('td',{},String(x))}))}));
  out.replaceChildren(
   bad?h('p',{class:'warn'},bad+' baris dilewati karena formatnya tidak valid.'):null,
   h('h3',{},'Rekap ('+rows.length+' murid)'),h('p',{class:'mut'},'M Mekanik, P Pemrograman, E Elektronika, T Troubleshooting (0–4)'),h('div',{class:'tw'},tb),
   h('h3',{style:'margin-top:18px'},'Usulan tim seimbang (pola ular)'),
   teams.map(function(tm,i){
    var tot=tm.reduce(function(s,r){return s+r.t},0),miss=['M','P','E'].filter(function(k){return !tm.some(function(r){return r[k]>=3})}).map(function(k){return D.filter(function(d){return d.k===k})[0].n});
    return h('div',{class:'card'},h('h3',{},'Tim '+String.fromCharCode(65+i)+' · total '+tot),
     tm.map(function(r){return h('div',{},r.n+' ('+r.k+') · '+prof(r.t)+' · M'+r.M+' P'+r.P+' E'+r.E+' T'+r.T)}),
     miss.length?h('p',{class:'warn',style:'margin-top:8px'},'Belum ada anggota kuat (skor 3 ke atas) di: '+miss.join(', ')+'. Pertimbangkan tukar anggota.'):h('p',{class:'mut',style:'margin-top:8px'},'Mekanik, pemrograman, dan elektronika sudah terwakili.'))}))}
 show(h('h1',{},'Mode guru'),h('p',{class:'mut'},'Tempel kode hasil dari murid. Tim dibagi dari skor tertinggi ke terendah dengan pola ular supaya total skor antar-tim seimbang. Periksa dan sesuaikan manual bila perlu.'),
 h('div',{class:'card'},ta,h('label',{},'Jumlah tim'),nt,h('button',{class:'btn',onclick:go},'Rekap dan bagi tim')),out,
 h('footer',{},h('button',{onclick:intro},'Kembali ke halaman murid')))}
intro();
</script>
